<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 627px;
      overflow: hidden;
      background: #0b0b0d;
    }

    body {
      color: #f2f1ec;
      display: flex;
      align-items: center;
      padding: 0 72px 0 220px;
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    h1 {
      font-family: Syne, system-ui, sans-serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .name {
      font-family: Syne, system-ui, sans-serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: rgba(242, 241, 236, 0.88);
    }

    .role {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      color: rgba(242, 241, 236, 0.62);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(242, 241, 236, 0.24);
      margin: 2px 0;
    }

    .tags {
      font-size: 15px;
      font-weight: 400;
      line-height: 1;
      color: rgba(242, 241, 236, 0.44);
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Portfolio</h1>
    <p class="name">Vera Fedotova</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="role">UX/UI Designer</p>
    <p class="tags">SaaS · AI · Design systems · Complex applications</p>
  </div>
</body>
</html>
